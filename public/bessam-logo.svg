<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" fill="none">
  <!-- Architectural Geometric Monogram -->
  <g transform="translate(10, 12)">
    <!-- Outer diamond / square rotated frame -->
    <rect x="6" y="6" width="64" height="64" rx="2" stroke="#c5a880" stroke-width="1.75" transform="rotate(45 38 38)" opacity="0.85"/>
    <circle cx="38" cy="38" r="32" stroke="#c5a880" stroke-width="1" stroke-dasharray="2 3" opacity="0.5"/>
    <!-- Compass & Precision lines -->
    <line x1="38" y1="10" x2="38" y2="66" stroke="#c5a880" stroke-width="0.75" opacity="0.6"/>
    <line x1="10" y1="38" x2="66" y2="38" stroke="#c5a880" stroke-width="0.75" opacity="0.6"/>
    <!-- Architectural Stylized Monogram "B" & "D" -->
    <text x="38" y="46" font-family="'Cormorant Garamond', 'Times New Roman', serif" font-size="26" font-weight="700" fill="#c5a880" text-anchor="middle" letter-spacing="1">BD</text>
  </g>

  <!-- Typography Brand Identity -->
  <g transform="translate(105, 20)">
    <!-- Main Studio Name -->
    <text x="0" y="32" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="34" font-weight="600" letter-spacing="5" fill="#c5a880">
      BESSAM<tspan fill="#dfc8a8" font-size="28">.</tspan><tspan fill="#f7f6f2">DECO</tspan>
    </text>
    <!-- Subtitle: Rénovation & Architecture -->
    <text x="2" y="55" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" letter-spacing="4.5" fill="#a39e93">
      RÉNOVATION &amp; ARCHITECTURE
    </text>
  </g>
</svg>
